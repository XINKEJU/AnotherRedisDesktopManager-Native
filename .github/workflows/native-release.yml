name: Native release artifacts

# Builds and verifies the artifact, then publishes the GitHub Release for a tag.
# Publishing used to be manual, and a release that nobody attaches SHA256SUMS to
# is worse than none: the in-app updater reads releases/latest, takes the first
# .zip/.dmg asset, and refuses to install it unless SHA256SUMS is attached too.
# Doing it here is what makes "check for updates" actually work.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    name: Build, package, verify
    # Xcode 26+ SDK required: UITheme.swift's Glass calls are runtime-guarded
    # (`if #available(macOS 26)`), not compile-time-guarded, so an older SDK
    # fails the build even though the app still targets macOS 14.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcrun --sdk macosx --show-sdk-version
          # sed, not head: an early-exiting reader can SIGPIPE the writer under
          # Actions' default `-o pipefail`.
          xcrun swiftc --version 2>&1 | sed -n '1p'

      - name: Run native tests
        run: bash native/tests/run.sh

      - name: Build and package
        run: |
          set -o pipefail
          { bash native/build.sh && bash native/package.sh; } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Surface the build error as annotations
        # Job logs need an authenticated API call; annotations do not. A release
        # that dies at 23:50 should say why on the Checks page.
        if: failure()
        run: |
          grep -E "error:|ERROR|fatal error|Undefined symbol" "$RUNNER_TEMP/build.log" \
            | awk 'NR <= 12 { sub(/%/, "%25"); print "::error::" $0 }'
          grep -qE "error:|ERROR" "$RUNNER_TEMP/build.log" \
            || echo "::error::build/package failed without printing a recognizable error line; see the job log."

      - name: Assert the tag matches the bundle version
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "native/RDM Native.app/Contents/Info.plist")"
          echo "bundle version: $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "::error::tag is v$TAG but native/Info.plist says $VERSION — bump the plist before tagging, or the updater offers the wrong version." >&2
              exit 1
            fi
          else
            echo "Not a tag push ($GITHUB_REF); version check skipped."
          fi

      - name: Verify the shipped zip end to end
        # Everything the in-app updater checks before it touches /Applications.
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "native/RDM Native.app/Contents/Info.plist")"
          ZIP="native/dist/RDM-Native-${VERSION}-arm64.zip"
          test -f "$ZIP"                       || { echo "::error::missing $ZIP"; exit 1; }
          test -f native/dist/SHA256SUMS       || { echo "::error::missing SHA256SUMS"; exit 1; }
          (cd native/dist && shasum -a 256 -c SHA256SUMS)

          WORK="$(mktemp -d)"
          /usr/bin/ditto -x -k "$ZIP" "$WORK"
          APP="$WORK/RDM Native.app"
          test -d "$APP"                       || { echo "::error::zip has no .app wrapper"; exit 1; }
          codesign --verify --deep --strict "$APP"
          # Capture before grepping: under `set -o pipefail` a `grep -q` that
          # exits early can kill the writer with SIGPIPE and fail the pipeline
          # even when the pattern matched. Older toolchains also print "minos 14"
          # where newer ones print "minos 14.0", so compare the number.
          BUILD_INFO="$(vtool -show-build "$APP/Contents/MacOS/rdm-native")"
          MINOS="$(awk '/minos/ {gsub(/[^0-9.]/, "", $2); print $2; exit}' <<<"$BUILD_INFO")"
          case "$MINOS" in
            14|14.0) ;;
            *) echo "::error::artifact is stamped minos '$MINOS', expected 14.0"; exit 1 ;;
          esac
          test "$(lipo -archs "$APP/Contents/MacOS/rdm-native")" = "arm64"
          LANGS="$(find "$APP/Contents/Resources/langs" -name '*.js' | wc -l | tr -d ' ')"
          test "$LANGS" -ge 13                 || { echo "::error::only $LANGS language tables bundled"; exit 1; }
          test -f "$APP/Contents/Resources/commands.js"
          # The icon is the folder + Redis-stack mark built by native/icons/make-icns.sh;
          # a missing or empty .icns means the Finder/Dock icon silently fell back.
          test -s "$APP/Contents/Resources/icon.icns" \
            || { echo "::error::icon.icns is missing or empty"; exit 1; }
          echo "verified: $(du -h "$APP" | cut -f1) bundle, $LANGS languages, sha256 ok"

      - uses: actions/upload-artifact@v4
        with:
          name: RDM-Native-${{ github.ref_name }}
          path: |
            native/dist/*.zip
            native/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: How to publish
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "native/RDM Native.app/Contents/Info.plist")"
          cat <<EOF
          On a tag push the release job publishes these two files for you:
            RDM-Native-${VERSION}-arm64.zip
            SHA256SUMS
          A release without SHA256SUMS cannot be auto-installed: the updater rejects
          ad-hoc signed downloads it cannot checksum.
          EOF

  release:
    name: Publish the GitHub Release
    needs: artifact
    # Only a tag is a release. workflow_dispatch builds the same artifact but must
    # not move releases/latest out from under whatever is current.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RDM-Native-${{ github.ref_name }}
          path: assets

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="assets/RDM-Native-${VERSION}-arm64.zip"
          SUMS="assets/SHA256SUMS"
          test -f "$ZIP"  || { echo "::error::artifact has no $ZIP"; exit 1; }
          test -f "$SUMS" || { echo "::error::artifact has no SHA256SUMS"; exit 1; }
          # The runner re-hashes what it is about to publish rather than trusting
          # the file the build job wrote: a mismatch means the two assets in this
          # release disagree, and the updater would reject the download at runtime.
          ACTUAL="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          grep -qE "^${ACTUAL}[[:space:]]+RDM-Native-${VERSION}-arm64\.zip$" "$SUMS" \
            || { echo "::error::SHA256SUMS does not cover the zip being published"; exit 1; }

          cat > notes.md <<EOF
          RDM Native ${VERSION} — native SwiftUI + AppKit build, macOS 14.0+, Apple silicon.

          | File | Purpose |
          | --- | --- |
          | \`RDM-Native-${VERSION}-arm64.zip\` | the \`.app\`, ad-hoc signed |
          | \`SHA256SUMS\` | required by the in-app updater |

          \`\`\`
          ${ACTUAL}  RDM-Native-${VERSION}-arm64.zip
          \`\`\`

          Unzip and move \`RDM Native.app\` to /Applications. Ad-hoc signing means the
          first launch needs a right-click Open, or \`xattr -dr com.apple.quarantine\`.
          EOF

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
            echo "Assets re-attached to the existing release."
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" "$SUMS" \
              --title "RDM Native ${VERSION}" --notes-file notes.md \
              --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
          URL="$(gh release view "$GITHUB_REF_NAME" --json url -q .url --repo "$GITHUB_REPOSITORY")"
          echo "### Published ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "published $URL"
