name: Native app

# CI for the pure-Swift app in native/. The Electron workflows under
# .github/workflows/build_*.yml do not cover it.
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "src/i18n/langs/**"
      - "src/commands.js"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "src/i18n/langs/**"
      - "src/commands.js"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Core + updater regression
    # Same image as the build job, so the suite is exercised by the toolchain
    # that actually produces the shipped binary. See the build job for why the
    # image has to carry an Xcode 26+ SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swiftc --version | head -1
          python3 --version

      - name: Run native tests
        run: bash native/tests/run.sh

  build:
    name: Build the .app
    # The image must carry an Xcode 26+ SDK: UITheme.swift calls SwiftUI's Glass
    # APIs, and `if #available(macOS 26)` guards the *runtime* only — the symbols
    # still have to exist at compile time. On macos-15 this job failed with
    # "cannot find 'Glass' in scope" at UITheme.swift:77 while the tests job
    # stayed green, because tests/run.sh compiles the core sources and no UI
    # file. macos-14 was retired by GitHub (jobs there are cancelled before a
    # runner appears). The deployment target is unaffected: build.sh pins
    # -target arm64-apple-macos14.0 and asserts minos 14.0 on the result.
    runs-on: macos-26
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign (ad-hoc)
        run: |
          set -o pipefail
          bash native/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Surface the build error as annotations
        # Job logs need an authenticated API call, annotations do not. Repeating
        # the first errors here means a red build explains itself on the Checks
        # page instead of making someone open the log.
        if: failure()
        # awk, not head: under Actions' default `-o pipefail` an early-exiting
        # reader SIGPIPEs grep and fails the step for the wrong reason.
        run: |
          grep -E "error:|ERROR|fatal error|Undefined symbol" "$RUNNER_TEMP/build.log" \
            | awk 'NR <= 12 { sub(/%/, "%25"); print "::error::" $0 }' \
            | sed -n '1,20p'
          grep -qE "error:|ERROR" "$RUNNER_TEMP/build.log" \
            || echo "::error::build.sh failed without printing a recognizable error line; see the job log."

      - name: Assert the deployment target and architecture
        run: |
          set -euo pipefail
          BIN="native/ARDM Native.app/Contents/MacOS/ardm-native"
          lipo -info "$BIN"
          # Read the whole vtool report first: an `awk ... exit` inside a command
          # substitution can SIGPIPE the writer, and `set -o pipefail` would then
          # fail the step even though minos was correct. "14" and "14.0" are the
          # same target, spelled differently by different toolchain generations.
          BUILD_INFO="$(vtool -show-build "$BIN")"
          MINOS="$(awk '/minos/ {gsub(/[^0-9.]/, "", $2); print $2; exit}' <<<"$BUILD_INFO")"
          echo "minos = $MINOS"
          case "$MINOS" in
            14|14.0) ;;
            *) echo "::error::binary is stamped minos '$MINOS', expected 14.0"; exit 1 ;;
          esac
          codesign --verify --deep --strict "native/ARDM Native.app"

      - name: Package
        run: bash native/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ARDM-Native-arm64
          path: |
            native/dist/*.zip
            native/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
